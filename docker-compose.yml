# โครงสร้างพื้นฐานสำหรับ dev — ตัวแอปยังรันนอก container ตอนพัฒนา
# ใช้: pnpm db:up  (หรือ docker compose up -d)

services:
  postgres:
    image: postgres:17-alpine
    container_name: clinicq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinicq
      POSTGRES_PASSWORD: clinicq_dev_pw
      POSTGRES_DB: clinicq
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    ports:
      # map 5433 บนเครื่อง เพื่อไม่ชนกับ postgres ตัวอื่นที่อาจติดตั้งไว้แล้ว
      - '5433:5432'
    volumes:
      - clinicq-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clinicq -d clinicq']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: clinicq-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6380:6379'
    volumes:
      - clinicq-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clinicq-pgdata:
  clinicq-redisdata:
